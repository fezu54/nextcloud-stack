services:
  db:
    image: mariadb:10.11
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    restart: always
    volumes:
      - db:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MARIADB_AUTO_UPGRADE=1
      - MARIADB_DISABLE_UPGRADE_BACKUP=1
    networks: 
      - backups
      - nextcloud_network

  redis:
    image: redis:alpine
    restart: always
    networks:
      - nextcloud_network

  app:
    build: ./app
    restart: always
    volumes:
      - nextcloud:/var/www/html
      - ./app/upload_max_filesize.ini:/usr/local/etc/php/conf.d/upload-max-filesize.ini
      - ./app/memory-limit.ini:/usr/local/etc/php/conf.d/memory-limit.ini
    tmpfs:
      - /tmp:exec,mode=1777
    environment:
      - VIRTUAL_HOST=${NEXTCLOUD_PREFIX}.${DNS_ADDRESS}
      - VIRTUAL_NETWORK=proxy-tier
      - LETSENCRYPT_HOST=${NEXTCLOUD_PREFIX}.${DNS_ADDRESS}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
      - MYSQL_HOST=db
      - REDIS_HOST=redis
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - TRUSTED_PROXIES=172.16.0.0/12
    env_file:
      - php.env
    depends_on:
      - db
      - redis
    networks:
      - proxy-tier
      - nextcloud_network
      - backups

  harp-proxy:
    image: ghcr.io/nextcloud/nextcloud-appapi-harp:release
    container_name: harp-proxy
    restart: always
    environment:
      - HP_SHARED_KEY=${APPAPI_SHARED_KEY}
      - NC_INSTANCE_URL=https://${NEXTCLOUD_PREFIX}.${DNS_ADDRESS}
      - HP_TRUSTED_PROXY_IPS=172.16.0.0/12,172.17.0.0/12,172.18.0.0/12,172.19.0.0/12
      - HP_IP=0.0.0.0
      - HP_PORT=8780
      - HP_DOCKER_NETWORK=nextcloud_network
    networks:
      - nextcloud_network
      - proxy-tier
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - app

  vaultwarden:
    image: vaultwarden/server:latest
    restart: always
    volumes:
      - vaultwarden:/data
    environment:
      # - ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN}
      - VIRTUAL_HOST=${VAULTWARDEN_PREFIX}.${DNS_ADDRESS}
      - VIRTUAL_NETWORK=proxy-tier
      - LETSENCRYPT_HOST=${VAULTWARDEN_PREFIX}.${DNS_ADDRESS}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
    networks:
      - proxy-tier
      - backups

  borgmatic_backup:
    build:
      context: ./backup
      args:
        BORGMATIC_VERSION: 2.1.3
        RCLONE_VERSION: v1.73.2
    volumes:
      - nextcloud:/mnt/source:ro
      - vaultwarden:/mnt/vaultwarden:ro
      - freshrss_data:/mnt/freshrss:ro
      - ${VOLUME_TARGET}:/mnt/borg-repository
      - ./backup/borgmatic.d:/etc/borgmatic.d
      - borg-config:/root/.config/borg
      - borg-cache:/root/.cache/borg
    environment:
      - TZ=${TZ}
      - BORG_PASSPHRASE=${BORG_PASSPHRASE}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - NEXTCLOUD_DATABASE=nextcloud
      - FRESHRSS_DATABASE=freshrss
      - MYSQL_PWD=${MYSQL_ROOT_PASSWORD}
      - NTFY_TOPIC=${NTFY_TOPIC}
      - NTFY_TOKEN=${NTFY_TOKEN}
      - NTFY_URL=http://ntfy:80
      - RCLONE_CONFIG_NEXTCLOUD_TYPE
      - RCLONE_CONFIG_NEXTCLOUD_PROVIDER
      - RCLONE_CONFIG_NEXTCLOUD_ACL
      - RCLONE_CONFIG_NEXTCLOUD_ACCESS_KEY_ID
      - RCLONE_CONFIG_NEXTCLOUD_SECRET_ACCESS_KEY
      - RCLONE_CONFIG_NEXTCLOUD_ENDPOINT
    restart: always
    networks:
      - backups
        
  cron:
    build: ./app
    restart: always
    volumes:
      - nextcloud:/var/www/html
    entrypoint: /cron.sh
    depends_on:
      - db
      - redis
    environment:
      - MYSQL_HOST=db
      - REDIS_HOST=redis
    networks:
      - backups
      - nextcloud_network

  ntfy:
    image: binwiederhier/ntfy
    restart: always
    command: serve
    volumes:
      - ntfy_cache:/var/cache/ntfy
      - ntfy_config:/etc/ntfy
    environment:
      - TZ=${TZ}
      - NTFY_BASE_URL=https://${NTFY_PREFIX}.${DNS_ADDRESS}
      - NTFY_BEHIND_PROXY=true
      - NTFY_AUTH_FILE=/var/cache/ntfy/user.db
      - NTFY_AUTH_DEFAULT_ACCESS=deny-all
      - VIRTUAL_HOST=${NTFY_PREFIX}.${DNS_ADDRESS}
      - VIRTUAL_NETWORK=proxy-tier
      - VIRTUAL_PORT=80
      - LETSENCRYPT_HOST=${NTFY_PREFIX}.${DNS_ADDRESS}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
      - NTFY_ENABLE_LOGIN=true
      - NTFY_REQUIRE_LOGIN=true
    networks:
      - backups
      - proxy-tier

  freshrss:
    image: freshrss/freshrss:latest
    container_name: freshrss
    restart: always
    environment:
      - TZ=${TZ}
      - CRON_MIN=1,31
      - DB_TYPE=mysql
      - DB_HOST=db
      - DB_USER=freshrss
      - DB_PASSWORD=${FRESH_RSS_DB_PASSWORD}
      - DB_BASE=freshrss
      - VIRTUAL_HOST=${FRESH_RSS_PREFIX}.${DNS_ADDRESS}
      - VIRTUAL_NETWORK=proxy-tier
      - VIRTUAL_PORT=80
      - LETSENCRYPT_HOST=${FRESH_RSS_PREFIX}.${DNS_ADDRESS}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
    volumes:
      - freshrss_data:/var/www/FreshRSS/data
    networks:
      - proxy-tier
      - backups
    depends_on:
      - db

  proxy:
    build: ./proxy
    container_name: proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    labels:
      com.github.jrcs.letsencrypt_nginx_proxy_companion.nginx_proxy: "true"
    volumes:
      - certs:/etc/nginx/certs:ro
      - acme:/etc/acme.sh
      - ./proxy/vhost.d:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - /var/run/docker.sock:/tmp/docker.sock:ro
    environment:
      - ENABLE_IPV6=true
      - DEFAULT_NETWORK=proxy-tier
    networks:
      - proxy-tier

  letsencrypt-companion:
    image: nginxproxy/acme-companion
    restart: always
    volumes:
      - certs:/etc/nginx/certs
      - ./proxy/vhost.d:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - acme:/etc/acme.sh
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy-tier
    depends_on:
      - proxy

volumes:
  db:
  nextcloud:
  freshrss_data:
  certs:
  acme:
  html:
  borg-cache:
  borg-config:
  vaultwarden:
  ntfy_cache:
  ntfy_config:

networks:
  proxy-tier:
  backups:
  nextcloud_network:
