services:
  db:
    image: mariadb:10.11
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    restart: always
    volumes:
      - db:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MARIADB_AUTO_UPGRADE=1
      - MARIADB_DISABLE_UPGRADE_BACKUP=1
    env_file:
      - db.env
    networks: 
      - backups

  redis:
    image: redis:alpine
    restart: always

  app:
    image: nextcloud:32-apache
    restart: always
    volumes:
      - nextcloud:/var/www/html
      - ./app/upload_max_filesize.ini:/usr/local/etc/php/conf.d/upload-max-filesize.ini
      - ./app/memory-limit.ini:/usr/local/etc/php/conf.d/memory-limit.ini
      - type: tmpfs
        target: /tmp:exec
    environment:
      - VIRTUAL_HOST=${NEXTCLOUD_PREFIX}.${DNS_ADDRESS}
      - LETSENCRYPT_HOST=${NEXTCLOUD_PREFIX}.${DNS_ADDRESS}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
      - MYSQL_HOST=db
      - REDIS_HOST=redis
    env_file:
      - db.env
      - php.env
    depends_on:
      - db
      - redis
    networks:
      - proxy-tier
      - default
      - backups

  vaultwarden:
    image: vaultwarden/server:latest
    restart: always
    volumes:
      - vaultwarden:/data
    environment:
      # - ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN}
      - VIRTUAL_HOST=${VAULTWARDEN_PREFIX}.${DNS_ADDRESS}
      - LETSENCRYPT_HOST=${VAULTWARDEN_PREFIX}.${DNS_ADDRESS}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
    networks:
      - proxy-tier
      - backups

  borgmatic_backup:
    build:
      context: ./backup
      args:
        BORGMATIC_VERSION: 2.1.3
        RCLONE_VERSION: v1.73.2
    volumes:
      - nextcloud:/mnt/source:ro
      - vaultwarden:/mnt/vaultwarden:ro
      - ${VOLUME_TARGET}:/mnt/borg-repository
      - ./backup/borgmatic.d:/etc/borgmatic.d
      - borg-config:/root/.config/borg
      - borg-cache:/root/.cache/borg
    environment:
      - TZ=${TZ}
      - BORG_PASSPHRASE=${BORG_PASSPHRASE}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - NEXTCLOUD_DATABASE=nextcloud
      - MYSQL_PWD=${MYSQL_ROOT_PASSWORD}
      - NTFY_TOPIC=${NTFY_TOPIC}
      - NTFY_TOKEN=${NTFY_TOKEN}
      - NTFY_URL=http://ntfy:80
      - RCLONE_CONFIG_NEXTCLOUD_TYPE
      - RCLONE_CONFIG_NEXTCLOUD_PROVIDER
      - RCLONE_CONFIG_NEXTCLOUD_ACL
      - RCLONE_CONFIG_NEXTCLOUD_ACCESS_KEY_ID
      - RCLONE_CONFIG_NEXTCLOUD_SECRET_ACCESS_KEY
      - RCLONE_CONFIG_NEXTCLOUD_ENDPOINT
    restart: always
    networks:
      - backups
        
  cron:
    image: nextcloud:32-apache
    restart: always
    volumes:
      - nextcloud:/var/www/html
    entrypoint: /cron.sh
    depends_on:
      - db
      - redis
    environment:
      - MYSQL_HOST=db
      - REDIS_HOST=redis
    networks:
      - backups
      - default

  ntfy:
    image: binwiederhier/ntfy
    restart: always
    command: serve
    volumes:
      - ntfy_cache:/var/cache/ntfy
      - ntfy_config:/etc/ntfy
    environment:
      - TZ=${TZ}
      - NTFY_BASE_URL=https://${NTFY_PREFIX}.${DNS_ADDRESS}
      - NTFY_BEHIND_PROXY=true
      - NTFY_AUTH_FILE=/var/cache/ntfy/user.db
      - NTFY_AUTH_DEFAULT_ACCESS=deny-all
      - VIRTUAL_HOST=${NTFY_PREFIX}.${DNS_ADDRESS}
      - VIRTUAL_PORT=80
      - LETSENCRYPT_HOST=${NTFY_PREFIX}.${DNS_ADDRESS}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
    networks:
      - backups
      - proxy-tier

  proxy:
    build: ./proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    labels:
      com.github.jrcs.letsencrypt_nginx_proxy_companion.nginx_proxy: "true"
    volumes:
      - certs:/etc/nginx/certs:ro
      - acme:/etc/acme.sh
      - ./proxy/vhost.d:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - /var/run/docker.sock:/tmp/docker.sock:ro
    environment:
      - ENABLE_IPV6=true
    networks:
      - proxy-tier

  letsencrypt-companion:
    image: nginxproxy/acme-companion
    restart: always
    volumes:
      - certs:/etc/nginx/certs
      - ./proxy/vhost.d:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - acme:/etc/acme.sh
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy-tier
    depends_on:
      - proxy

volumes:
  db:
  nextcloud:
  certs:
  acme:
  html:
  borg-cache:
  borg-config:
  vaultwarden:
  ntfy_cache:
  ntfy_config:

networks:
  proxy-tier:
  backups:
